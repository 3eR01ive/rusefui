<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rusefui</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #faf7f2; }
      #app { height: 100%; }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        gap: 1.25rem;
        pointer-events: none;
        user-select: none;
      }
      #splash img {
        width: 112px;
        height: 112px;
        border-radius: 20px;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.18s ease-out;
      }
      #splash img.loaded {
        opacity: 1;
      }
      #splash-name {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #3a3530;
        animation: splash-in 0.2s ease-out both;
      }
      #splash-name span { color: #e07020; }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.95); }
        to   { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="splash">
        <img src="/logo.png" alt="logo" onload="this.classList.add('loaded')" />
        <div id="splash-name">rus<span>EFI</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
