id: knock.panel
description: Knock tuning — threshold autotune, спектр частоты, momentum knock

children:
  - type: knock
    id: knock-main
    props:
      height: 360
      knockSettingsPanel: generated/softwareknock.panel
    bind:
      source: outputChannels
      params:
        rpmField: RPMValue
        knockLevelField: m_knockLevel
        knockThresholdField: m_knockThreshold
        loadField: ignitionLoad
        advanceField: ignitionAdvanceCyl1
