# Монитор: live values + график output channels.
id: monitor.panel
description: Output channels — значения и кривые

children:
  - type: section
    props:
      title: Log
    children:
      - type: output-chart
        id: scope
        props:
          height: 240
          windowSeconds: 30
          fields:
            - RPMValue
            - coolant

  - type: section
    props:
      title: Live values
    children:
      - type: row
        children:
          - type: output-value
            id: rpm
            props:
              label: RPM
              unit: rpm
              decimals: 0
            bind:
              source: outputChannels
              field: RPMValue

          - type: output-value
            id: clt
            props:
              label: CLT
              unit: "°C"
              decimals: 1
            bind:
              source: outputChannels
              field: coolant

      - type: text
        props:
          text: "Опрос outputChannels ~200 Hz. Все параметры пишутся в CSV на сессию (см. sessionLogPath / protocol.log при подключении)."
          variant: hint
