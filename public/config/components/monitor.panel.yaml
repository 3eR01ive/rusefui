# Монитор: live values + график output channels.
id: monitor.panel
description: Output channels — значения и кривые

children:
  - type: section
    props:
      title: Log
    children:
      - type: output-chart
        id: scope
        props:
          height: 240
          windowSeconds: 30
          fields:
            - RPMValue
            - coolant

  - type: section
    props:
      title: Trigger logger
    children:
      - type: composite-chart
        id: trigger-logger
        props:
          height: 220
          windowMs: 500
          # autoStopSec: 0  # авто-disable на ECU через N с (0 = только в UI)

  - type: section
    props:
      title: Live values
    children:
      - type: row
        children:
          - type: output-value
            id: rpm
            props:
              label: RPM
              unit: rpm
              decimals: 0
            bind:
              source: outputChannels
              field: RPMValue

          - type: output-value
            id: clt
            props:
              label: CLT
              unit: "°C"
              decimals: 1
            bind:
              source: outputChannels
              field: coolant

      - type: text
        props:
          text: "Output: live snapshot + OutputTimeline (окно, перемотка, CSV-сессия). Log читает через timeline."
          variant: hint
