# Пример вкладки с output-компонентами (данные появятся после polling).
id: monitor.panel
description: Превью декларативных output-привязок

children:
  - type: section
    props:
      title: Live values (заглушка)
    children:
      - type: row
        children:
          - type: output-value
            id: rpm
            props:
              label: RPM
              unit: rpm
              decimals: 0
            bind:
              source: outputChannels
              field: RPMValue

          - type: output-value
            id: clt
            props:
              label: CLT
              unit: "°C"
              decimals: 1
            bind:
              source: outputChannels
              field: coolant

      - type: text
        props:
          text: "Опрос outputChannels (команда O) в Rust ~10 Hz. Поля пока по скелету INI f407-discovery."
          variant: hint
