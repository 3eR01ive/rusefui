# Монитор: live values + график output channels.
id: monitor.panel
description: Output channels — значения и кривые

children:
  - type: section
    props:
      title: Log
    children:
      - type: output-chart
        id: scope
        navSelectable: false
        props:
          height: 240
          windowSeconds: 30
        bind:
          source: outputChannels
          fields:
            - RPMValue
            - coolant

  - type: section
    props:
      title: Trigger logger
    children:
      - type: composite-chart
        id: trigger-logger
        navSelectable: false
        props:
          height: 220
          windowMs: 500
        bind:
          source: compositeLogger
          # autoStopSec: 0  # авто-disable на ECU через N с (0 = только в UI)

  - type: canvas
    id: live-canvas
    props:
      title: Live values
    children:
      - id: rpm
        type: output-value
        props:
          label: RPM
          unit: rpm
          decimals: 0
          displayType: gauge
          min: 0
          max: 8000
        bind:
          source: outputChannels
          field: RPMValue
        layout:
          x: 8
          y: 8
          w: 136
          h: 136

      - id: clt
        type: output-value
        props:
          label: CLT
          unit: "°C"
          decimals: 1
          displayType: gauge
          min: -20
          max: 120
        bind:
          source: outputChannels
          field: coolant
        layout:
          x: 152
          y: 8
          w: 136
          h: 136

      - id: hint
        type: text
        props:
          text: "Output: live snapshot + OutputTimeline (окно, перемотка, CSV-сессия). Log читает через timeline."
          variant: hint
        layout:
          x: 8
          y: 160
          w: 480
          h: 48
