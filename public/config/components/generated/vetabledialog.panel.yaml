id: veTableDialog.panel
description: VE
source:
  ini_dialog: veTableDialog
  menu_path: Fuel › VE
children:
- type: section
  props:
    title: Fuel
  children:
  - type: text
    props:
      variant: hint
      text: https://rusefi.com/s/fuel
  - type: enum-field
    id: fuelalgorithm
    props:
      label: Fuel strategy
      options:
      - value: 0
        label: Speed Density
      - value: 1
        label: MAF Air Charge
      - value: 2
        label: Alpha-N
      - value: 3
        label: Lua
    bind:
      source: config
      field: fuelAlgorithm
- type: section
  props:
    title: Load override
  children:
  - type: enum-field
    id: veoverridemode
    props:
      options:
      - value: 0
        label: None
      - value: 1
        label: MAP
      - value: 2
        label: TPS
      - value: 3
        label: INVALID
      label: Override VE table load axis
    bind:
      source: config
      field: veOverrideMode
- type: config-table
  id: vetabletbl
  props:
    title: VE Table
    xLabel: RPM
    variant: table
  bind:
    source: config
    params:
      xBins: veRpmBins
      zBins: veTable
      yBins: veLoadBins
