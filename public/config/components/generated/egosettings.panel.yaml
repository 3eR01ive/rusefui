id: egoSettings.panel
description: CAN O2 sensors
source:
  ini_dialog: egoSettings
  menu_path: Sensors › Chassis sensors › CAN O2 sensors
children:
- type: section
  props:
    title: CAN UEGO 1
  children:
  - type: section
    props:
      title: uegoCan0ConfigPanel
    children:
    - type: enum-field
      id: canwbo1-type
      props:
        label: UEGO type
        options:
        - value: 0
          label: RusEFI
        - value: 1
          label: AEM X-series
        - value: 2
          label: Disabled/Analog
        - value: 3
          label: INVALID
      bind:
        source: config
        field: canWbo1_type
    - type: enum-field
      id: canwbo1-reid
      props:
        label: RusEFI WBO ID
        options:
        - value: 0
          label: ID1 0x190/191
        - value: 1
          label: ID2 0x192/193
        - value: 2
          label: ID3 0x194/195
        - value: 3
          label: ID4 0x196/197
        - value: 4
          label: ID5 0x198/199
        - value: 5
          label: ID6 0x19A/19B
        - value: 6
          label: ID7 0x19C/19D
        - value: 7
          label: ID8 0x19E/19F
        - value: 8
          label: ID9 0x200/201
        - value: 9
          label: ID10 0x202/203
        - value: 10
          label: ID11 0x204/205
        - value: 11
          label: ID12 0x206/207
        - value: 12
          label: ID13 0x208/209
        - value: 13
          label: ID14 0x20A/20B
        - value: 14
          label: ID15 0x20C/20D
        - value: 15
          label: ID16 0x20E/20F
      bind:
        source: config
        field: canWbo1_reId
    - type: enum-field
      id: canwbo1-aemid
      props:
        label: AEM ID
        options:
        - value: 0
          label: ID1 0x0000180
        - value: 1
          label: ID2 0x0000181
        - value: 2
          label: ID3 0x0000182
        - value: 3
          label: ID4 0x0000183
        - value: 4
          label: ID5 0x0000184
        - value: 5
          label: ID6 0x0000185
        - value: 6
          label: ID7 0x0000186
        - value: 7
          label: ID8 0x0000187
        - value: 8
          label: ID9 0x0000188
        - value: 9
          label: ID10 0x0000189
        - value: 10
          label: ID11 0x000018A
        - value: 11
          label: ID12 0x000018B
        - value: 12
          label: ID13 0x000018C
        - value: 13
          label: ID14 0x000018D
        - value: 14
          label: ID15 0x000018E
        - value: 15
          label: ID16 0x000018F
      bind:
        source: config
        field: canWbo1_aemId
  - type: section
    props:
      title: uegoCan0Gauges
  - type: section
    props:
      title: uegoCan0IndicatorPanel
    children:
    - type: text
      props:
        text: Панель «uegoCan0Indicators» — нет определения в INI
        variant: hint
    - type: text
      props:
        text: Панель «uegoCan0IndicatorsExt» — нет определения в INI
        variant: hint
    - type: text
      props:
        variant: hint
        text: Панель «uegoCan0IndicatorsAem» — нет определения в INI
- type: section
  props:
    title: CAN O2 sensors
  children:
  - type: scalar-field
    id: support-for-aem-or-rusefi-can-uego
    props:
      label: Support for AEM or RusEFI CAN UEGO
    bind:
      source: config
      field: Support for AEM or RusEFI CAN UEGO
  - type: enum-field
    id: enableaemxseries
    props:
      label: Enable CAN Wideband
      options:
      - value: 0
        label: no
      - value: 1
        label: yes
    bind:
      source: config
      field: enableAemXSeries
  - type: enum-field
    id: widebandonsecondbus
    props:
      label: Wideband CAN bus
      options:
      - value: 0
        label: CAN1
      - value: 1
        label: CAN2
    bind:
      source: config
      field: widebandOnSecondBus
  - type: scalar-field
    id: afrexpaveragealpha
    props:
      label: Smoothing Factor
    bind:
      source: config
      field: afrExpAverageAlpha
  - type: text
    props:
      text: Please use force heating only for testing.
      variant: hint
  - type: text
    props:
      text: Never keep enabled outside workshop.
      variant: hint
  - type: text
    props:
      text: This can damage your sensor.
      variant: hint
  - type: enum-field
    id: forceo2heating
    props:
      label: Force O2 sensor heating
      options:
      - value: 0
        label: no
      - value: 1
        label: yes
    bind:
      source: config
      field: forceO2Heating
  - type: text
    props:
      variant: hint
      text: 'Кнопка: Restart all WBO (cmd_restart_widebands)'
  - type: text
    props:
      variant: hint
      text: 'Кнопка: Update 2023 Firmware from file (cmd_wideband_firmare_update_file)'
