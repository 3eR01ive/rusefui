id: mapCurves.panel
description: MAP sampling
source:
  ini_dialog: mapCurves
  menu_path: Sensors › Chassis sensors › MAP sampling
children:
- type: enum-field
  id: ismapaveragingenabled
  props:
    label: Window averaging
    options:
    - value: 0
      label: 'false'
    - value: 1
      label: 'true'
  bind:
    source: config
    field: isMapAveragingEnabled
- type: scalar-field
  id: mapexpaveragealpha
  props:
    label: mapExpAverageAlpha
  bind:
    source: config
    field: mapExpAverageAlpha
- type: text
  props:
    variant: hint
    text: Таблица/кривая «map_samplingAngleCurve» — редактор пока не реализован
- type: text
  props:
    variant: hint
    text: Таблица/кривая «map_samplingWindowCurve» — редактор пока не реализован
