id: mapCurves.panel
description: MAP sampling
source:
  ini_dialog: mapCurves
  menu_path: Sensors › Chassis sensors › MAP sampling
children:
- type: enum-field
  id: ismapaveragingenabled
  props:
    options:
    - value: 0
      label: 'false'
    - value: 1
      label: 'true'
    label: Window averaging
  bind:
    source: config
    field: isMapAveragingEnabled
- type: scalar-field
  id: mapexpaveragealpha
  props:
    label: mapExpAverageAlpha
  bind:
    source: config
    field: mapExpAverageAlpha
- type: curve
  id: map-samplinganglecurve
  props:
    xBins: map_samplingAngleBins
    xLabel: RPM
    yLabel: Angle
    yBins: map_samplingAngle
    title: MAP Sampling Start Angle
- type: curve
  id: map-samplingwindowcurve
  props:
    yLabel: Window
    title: MAP Sampling Duration
    xLabel: RPM
    xBins: map_samplingWindowBins
    yBins: map_samplingWindow
