id: wwTauCurves.panel
description: Wall wetting AE evaporation time
source:
  ini_dialog: wwTauCurves
  menu_path: Fuel › Wall wetting AE › Evap time
children:
- type: text
  props:
    text: Set a base evaporation time based on coolant temperature, and a multiplier based on MAP.
    variant: hint
- type: curve
  id: wwtaucltcurve
  props:
    yBins: wwTauCltValues
    title: Evap time vs. CLT
    yLabel: seconds
    xLabel: coolant
    xBins: wwCltBins
- type: curve
  id: wwtaumapcurve
  props:
    xBins: wwMapBins
    yBins: wwTauMapValues
    title: Evap time vs. MAP
    xLabel: MAP
    yLabel: mult
