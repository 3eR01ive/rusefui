id: antiLagDialog.panel
description: AntiLag/Rotational Idle Settings
source:
  ini_dialog: antiLagDialog
  menu_path: Advanced › Anti-Lag ALS
children:
- type: text
  props:
    variant: hint
    text: Also known as Rotational Idle
- type: enum-field
  id: antilagenabled
  props:
    label: AntiLag
    options:
    - value: 0
      label: disabled
    - value: 1
      label: enabled
  bind:
    source: config
    field: antiLagEnabled
- type: enum-field
  id: antilagactivationmode
  props:
    label: Activation Mode
    options:
