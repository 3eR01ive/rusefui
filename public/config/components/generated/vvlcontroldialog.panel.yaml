id: VvlControlDialog.panel
description: VVL Control
source:
  ini_dialog: VvlControlDialog
  menu_path: Advanced › VVL Control
children:
- type: section
  props:
    title: VvlControlSettingsDialog
  children:
  - type: scalar-field
    id: vvlcontrolenabled
    props:
      label: Enable VVL/Switched cam Control
    bind:
      source: config
      field: vvlControlEnabled
  - type: section
    props:
      title: Settings
    children:
    - type: scalar-field
      id: vvlrelaypin
      props:
        label: VVL Relay
      bind:
        source: config
        field: vvlRelayPin
    - type: scalar-field
      id: vvlrelaypinmode
      props:
        label: VVL Relay Mode
      bind:
        source: config
        field: vvlRelayPinMode
    - type: scalar-field
      id: vvlcontroller-minimumtps
      props:
        label: Minimum TPS
      bind:
        source: config
        field: vvlController_minimumTps
    - type: scalar-field
      id: vvlcontroller-minimumclt
      props:
        label: Minimum CLT
      bind:
        source: config
        field: vvlController_minimumClt
    - type: scalar-field
      id: vvlcontroller-maximummap
      props:
        label: Maximum MAP
      bind:
        source: config
        field: vvlController_maximumMap
    - type: scalar-field
      id: vvlcontroller-maximumafr
      props:
        label: Maximum AFR
      bind:
        source: config
        field: vvlController_maximumAfr
    - type: scalar-field
      id: vvlcontroller-activationrpm
      props:
        label: Activation RPM
      bind:
        source: config
        field: vvlController_activationRpm
    - type: scalar-field
      id: vvlcontroller-deactivationrpm
      props:
        label: Deactivation RPM
      bind:
        source: config
        field: vvlController_deactivationRpm
    - type: scalar-field
      id: vvlcontroller-deactivationrpmwindow
      props:
        label: Deactivation RPM Window
      bind:
        source: config
        field: vvlController_deactivationRpmWindow
    - type: scalar-field
      id: vvlcontroller-fueladderpercent
      props:
        label: Fuel Adder
      bind:
        source: config
        field: vvlController_fuelAdderPercent
    - type: scalar-field
      id: vvlcontroller-ignitionretard
      props:
        label: Ignition Retard
      bind:
        source: config
        field: vvlController_ignitionRetard
- type: section
  props:
    title: vvl_controller_state
  children:
  - type: text
    props:
      text: Панель «vvl_controller_stateIndicatorPanel» — нет определения в INI
      variant: hint
