id: cltSensor.panel
description: CLT Sensor
source:
  ini_dialog: cltSensor
  menu_path: Sensors › Chassis sensors › CLT sensor
children:
- type: section
  props:
    title: CLT sensor
  children:
  - type: scalar-field
    id: clt-adcchannel
    props:
      label: Input channel
    bind:
      source: config
      field: clt_adcChannel
  - type: text
    props:
      variant: hint
      text: Input three pairs of thermistor temperature and resistance.
  - type: text
    props:
      variant: hint
      text: Typical temperatures are -40 deg C, 0 deg C and 100 deg C
  - type: scalar-field
    id: clt-tempc-1
    props:
      label: Lowest temperature
    bind:
      source: config
      field: clt_tempC_1
  - type: scalar-field
    id: clt-resistance-1
    props:
      label: Resistance @ LT
    bind:
      source: config
      field: clt_resistance_1
  - type: scalar-field
    id: clt-tempc-2
    props:
      label: Middle temperature
    bind:
      source: config
      field: clt_tempC_2
  - type: scalar-field
    id: clt-resistance-2
    props:
      label: Resistance @ MT
    bind:
      source: config
      field: clt_resistance_2
  - type: scalar-field
    id: clt-tempc-3
    props:
      label: Highest temperature
    bind:
      source: config
      field: clt_tempC_3
  - type: scalar-field
    id: clt-resistance-3
    props:
      label: Resistance @ HT
    bind:
      source: config
      field: clt_resistance_3
  - type: scalar-field
    id: uselinearcltsensor
    props:
      label: Linear characteristic
    bind:
      source: config
      field: useLinearCltSensor
- type: section
  props:
    title: cltGauges
