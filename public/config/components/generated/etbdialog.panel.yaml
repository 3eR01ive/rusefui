id: etbDialog.panel
description: Electronic Throttle Body
source:
  ini_dialog: etbDialog
  menu_path: Advanced › Generic PWM › Electronic Throttle Body actuator
children:
- type: section
  props:
    title: etbDialogLeft
  children:
  - type: section
    props:
      title: Base ETB settings
    children:
    - type: scalar-field
      id: https---rusefi-com-s-etb
      props:
        label: https://rusefi.com/s/etb
      bind:
        source: config
        field: https://rusefi.com/s/etb
    - type: enum-field
      id: disableetbwhenenginestopped
      props:
        options:
        - value: 0
          label: no
        - value: 1
          label: yes
        label: Disable ETB if engine is stopped
      bind:
        source: config
        field: disableEtbWhenEngineStopped
    - type: scalar-field
      id: etbfreq
      props:
        label: PWM Frequency
      bind:
        source: config
        field: etbFreq
    - type: scalar-field
      id: etbminimumposition
      props:
        label: Minimum ETB position
      bind:
        source: config
        field: etbMinimumPosition
    - type: scalar-field
      id: etbmaximumposition
      props:
        label: Maximum ETB position
      bind:
        source: config
        field: etbMaximumPosition
  - type: section
    props:
      title: ETB Idle
    children:
    - type: scalar-field
      id: etbidlethrottlerange
      props:
        label: ETB idle maximum angle
      bind:
        source: config
        field: etbIdleThrottleRange
  - type: section
    props:
      title: ETB Jam detection settings
    children:
    - type: scalar-field
      id: etbjamdetectthreshold
      props:
        label: Jam detection error max
      bind:
        source: config
        field: etbJamDetectThreshold
    - type: scalar-field
      id: etbjamtimeout
      props:
        label: Jam detection timeout period
      bind:
        source: config
        field: etbJamTimeout
    - type: scalar-field
      id: disables-jam-detection-for-testing-until-the-next-power-cycle
      props:
        label: Disables jam detection for testing until the next power cycle
      bind:
        source: config
        field: Disables jam detection for testing until the next power cycle
    - type: text
      props:
        text: 'Кнопка: Temporarily disable jam detection (cmd_etb_disable_jam_detect)'
        variant: hint
  - type: text
    props:
      text: Панель «etbIndicatorPanel» — нет определения в INI
      variant: hint
- type: section
  props:
    title: etbDialogRight
  children:
  - type: section
    props:
      title: PID settings
    children:
    - type: scalar-field
      id: etb-pfactor
      props:
        label: pFactor
      bind:
        source: config
        field: etb_pFactor
    - type: scalar-field
      id: etb-ifactor
      props:
        label: iFactor
      bind:
        source: config
        field: etb_iFactor
    - type: scalar-field
      id: etb-dfactor
      props:
        label: dFactor
      bind:
        source: config
        field: etb_dFactor
    - type: scalar-field
      id: etb-minvalue
      props:
        label: pid min
      bind:
        source: config
        field: etb_minValue
    - type: scalar-field
      id: etb-maxvalue
      props:
        label: pid max
      bind:
        source: config
        field: etb_maxValue
    - type: scalar-field
      id: etb-itermmin
      props:
        label: iTermMin
      bind:
        source: config
        field: etb_iTermMin
    - type: scalar-field
      id: etb-itermmax
      props:
        label: iTermMax
      bind:
        source: config
        field: etb_iTermMax
  - type: section
    props:
      title: ETB 1 TPS sensor calibration
    children:
    - type: scalar-field
      id: first-step--calibrate-tps-and-hit--burn
      props:
        label: 'First step: calibrate TPS and hit ''Burn'''
      bind:
        source: config
        field: 'First step: calibrate TPS and hit ''Burn'''
    - type: scalar-field
      id: should-first-open--then-close
      props:
        label: Should first OPEN, then CLOSE
      bind:
        source: config
        field: Should first OPEN, then CLOSE
    - type: text
      props:
        text: Please check with your eyes that throttle first OPENS and then CLOSES
        variant: hint
    - type: text
      props:
        variant: hint
        text: If order is reversed swap ETB+/ETB- wires
    - type: text
      props:
        text: 'Bench test: opens ETB 300ms, no ignition/sensors needed'
        variant: hint
    - type: text
      props:
        variant: hint
        text: 'Кнопка: Bench Test ETB 1 (open 300ms) (cmd_etb_bench_test)'
    - type: text
      props:
        text: 'Кнопка: Auto Calibrate ETB 1 (cmd_etb_auto_calibrate)'
        variant: hint
  - type: section
    props:
      title: ETB 2 TPS sensor calibration
    children:
    - type: scalar-field
      id: first-step--calibrate-tps-and-hit--burn
      props:
        label: 'First step: calibrate TPS and hit ''Burn'''
      bind:
        source: config
        field: 'First step: calibrate TPS and hit ''Burn'''
    - type: scalar-field
      id: should-first-open--then-close
      props:
        label: Should first OPEN, then CLOSE
      bind:
        source: config
        field: Should first OPEN, then CLOSE
    - type: text
      props:
        text: Please check with your eyes that throttle first OPENS and then CLOSES
        variant: hint
    - type: text
      props:
        text: If order is reversed swap ETB+/ETB- wires
        variant: hint
    - type: text
      props:
        text: 'Bench test: opens ETB 300ms, no ignition/sensors needed'
        variant: hint
    - type: text
      props:
        text: 'Кнопка: Bench Test ETB 2 (open 300ms) (cmd_etb_bench_test_2)'
        variant: hint
    - type: text
      props:
        variant: hint
        text: 'Кнопка: Auto Calibrate ETB 2 (cmd_etb_auto_calibrate_2)'
  - type: section
    props:
      title: Sensor/PID autotune
    children:
    - type: scalar-field
      id: second-step--calibrate-pid
      props:
        label: 'Second step: calibrate PID'
      bind:
        source: config
        field: 'Second step: calibrate PID'
    - type: scalar-field
      id: run-pid-calibration-for-10--15-seconds-and-press-stop
      props:
        label: Run PID calibration for 10..15 seconds and press Stop
      bind:
        source: config
        field: Run PID calibration for 10..15 seconds and press Stop
    - type: scalar-field
      id: autotune-executed-for-etb-1-only--values-applied-for-all-etbs
      props:
        label: Autotune executed for ETB 1 only, values applied for all ETBs
      bind:
        source: config
        field: Autotune executed for ETB 1 only, values applied for all ETBs
    - type: text
      props:
        variant: hint
        text: 'Кнопка: Start ETB PID Autotune (cmd_etb_autotune)'
    - type: text
      props:
        text: 'Кнопка: Stop ETB PID Autotune (cmd_etb_autotune_stop)'
        variant: hint
