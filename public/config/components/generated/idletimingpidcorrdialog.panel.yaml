id: idleTimingPidCorrDialog.panel
description: Closed-loop idle timing
source:
  ini_dialog: idleTimingPidCorrDialog
  menu_path: Idle › Closed-loop idle timing
children:
- type: enum-field
  id: useidletimingpidcontrol
  props:
    options:
    - value: 0
      label: 'false'
    - value: 1
      label: 'true'
    label: Enable closed loop idle ignition timing
  bind:
    source: config
    field: useIdleTimingPidControl
- type: text
  props:
    text: Gain is in degrees advance per rpm away from target
    variant: hint
- type: text
  props:
    text: A good starting point is 0.1 = 10 deg per 100 rpm
    variant: hint
- type: scalar-field
  id: idletimingpid-pfactor
  props:
    label: Proportional gain
  bind:
    source: config
    field: idleTimingPid_pFactor
- type: scalar-field
  id: idletimingpid-ifactor
  props:
    label: Integral gain
  bind:
    source: config
    field: idleTimingPid_iFactor
- type: scalar-field
  id: idletimingpid-dfactor
  props:
    label: Derivative gain
  bind:
    source: config
    field: idleTimingPid_dFactor
- type: scalar-field
  id: idletimingpid-minvalue
  props:
    label: Min adjustment (retard)
  bind:
    source: config
    field: idleTimingPid_minValue
- type: scalar-field
  id: idletimingpid-maxvalue
  props:
    label: Max adjustment (advance)
  bind:
    source: config
    field: idleTimingPid_maxValue
- type: scalar-field
  id: idletimingsoftentrytime
  props:
    label: Soft entry time
  bind:
    source: config
    field: idleTimingSoftEntryTime
