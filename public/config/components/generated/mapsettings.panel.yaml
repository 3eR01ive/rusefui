          label: Analog Temp 4
        - value: 11
          label: Analog Volt 1
        - value: 12
          label: Analog Volt 2
        - value: 13
          label: Analog Volt 3
        - value: 14
          label: Analog Volt 4
        - value: 15
          label: Analog Temp 1
        - value: 16
          label: Analog Temp 2
        - value: 17
          label: INVALID
