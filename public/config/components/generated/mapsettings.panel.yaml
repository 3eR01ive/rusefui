id: mapSettings.panel
description: MAP sensor
source:
  ini_dialog: mapSettings
  menu_path: Sensors › Chassis sensors › MAP sensor
children:
- type: section
  props:
    title: mapSettingsLeft
  children:
  - type: section
    props:
      title: MAP common settings
    children:
    - type: scalar-field
      id: maperrordetectiontoolow
      props:
        label: Low value threshold
      bind:
        source: config
        field: mapErrorDetectionTooLow
    - type: scalar-field
      id: maperrordetectiontoohigh
      props:
        label: High value threshold
      bind:
        source: config
        field: mapErrorDetectionTooHigh
    - type: text
      props:
        text: Панель «mapValidIndicators» — нет определения в INI
        variant: hint
    - type: enum-field
      id: measuremaponlyinonecylinder
      props:
        label: Measure Map Only In One Cylinder
        options:
        - value: 0
          label: no
        - value: 1
          label: yes
      bind:
        source: config
        field: measureMapOnlyInOneCylinder
    - type: scalar-field
      id: mapminbufferlength
      props:
        label: Cylinder count to sample MAP
      bind:
        source: config
        field: mapMinBufferLength
    - type: scalar-field
      id: mapexpaveragealpha
      props:
        label: MAP sensor ExpAverage dampening
      bind:
        source: config
        field: mapExpAverageAlpha
  - type: section
    props:
      title: MAP sensor
    children:
    - type: enum-field
      id: map-sensor-hwchannel
      props:
        options:
        - value: 0
          label: NONE
        - value: 1
          label: Analog Volt 5
        - value: 2
          label: Analog Volt 6
        - value: 3
          label: Analog Volt 7
