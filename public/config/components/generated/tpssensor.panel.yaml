          label: Analog Volt 1
        - value: 12
          label: Analog Volt 2
        - value: 13
          label: Analog Volt 3
        - value: 14
          label: Analog Volt 4
        - value: 15
          label: Analog Temp 1
        - value: 16
          label: Analog Temp 2
        label: Primary sensor
      bind:
        source: config
        field: tps1_1AdcChannel
    - type: scalar-field
      id: tpsmin
      props:
        label: Primary min
      bind:
        source: config
        field: tpsMin
    - type: scalar-field
