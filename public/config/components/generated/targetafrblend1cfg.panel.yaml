id: targetAfrBlend1Cfg.panel
description: Target AFR adder 1 config
source:
  ini_dialog: targetAfrBlend1Cfg
  menu_path: Fuel › Target AFR adder tables › Target AFR 1 bias
children:
- type: text
  props:
    variant: hint
    text: The bias table controls how much of the adder table
- type: text
  props:
    text: is mixed in to the target AFR table. For example, a value of
    variant: hint
- type: text
  props:
    variant: hint
    text: +10 in the table, with 50 as the current bias will result
- type: text
  props:
    text: in +5.0 added to target AFR %.
    variant: hint
- type: text
  props:
    text: The X axis of the bias table is controlled by the selected blend
    variant: hint
- type: text
  props:
    text: parameter below.
    variant: hint
- type: scalar-field
  id: targetafrblends1-blendparameter
  props:
    label: Blend parameter
  bind:
    source: config
    field: targetAfrBlends1_blendParameter
- type: scalar-field
  id: targetafrblends1-yaxisoverride
  props:
    label: Y axis override (set Zero for no override)
  bind:
    source: config
    field: targetAfrBlends1_yAxisOverride
- type: text
  props:
    variant: hint
    text: Панель «targetAfrBlend1Bias» — нет определения в INI
