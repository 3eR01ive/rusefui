id: ignitionSettings.panel
description: Ignition settings
source:
  ini_dialog: ignitionSettings
  menu_path: Ignition › Ignition settings
children:
- type: section
  props:
    title: ignitionBasic
  children:
  - type: enum-field
    id: isignitionenabled
    props:
      label: Enabled
      options:
      - value: 0
        label: 'false'
      - value: 1
        label: 'true'
    bind:
      source: config
      field: isIgnitionEnabled
  - type: enum-field
    id: ignitionmode
    props:
      options:
      - value: 0
        label: Single Coil
      - value: 1
        label: Individual Coils
      - value: 2
        label: Wasted Spark
      - value: 3
        label: Two Distributors
      label: Mode
    bind:
      source: config
      field: ignitionMode
  - type: scalar-field
    id: sparkhardwarelatencycorrection
    props:
      label: Spark hardware latency correction
    bind:
      source: config
      field: sparkHardwareLatencyCorrection
  - type: enum-field
    id: twowirebatchignition
    props:
      options:
      - value: 0
        label: 'false'
      - value: 1
        label: 'true'
      label: Individually wired Wasted Spark
    bind:
      source: config
      field: twoWireBatchIgnition
  - type: enum-field
    id: ignoverridemode
    props:
      label: Override ignition table load axis
      options:
      - value: 0
        label: None
      - value: 1
        label: MAP
      - value: 2
        label: TPS
      - value: 3
        label: Acc Pedal
      - value: 4
        label: Cyl Filling %
      - value: 5
        label: INVALID
      - value: 6
        label: INVALID
      - value: 7
        label: INVALID
    bind:
      source: config
      field: ignOverrideMode
  - type: text
    props:
      variant: hint
      text: Use fixed timing while validating with a timing gun
  - type: enum-field
    id: timingmode
    props:
      label: Timing Mode
      options:
      - value: 0
        label: dynamic
      - value: 1
        label: fixed
    bind:
      source: config
      field: timingMode
  - type: scalar-field
    id: fixedtiming
    props:
      label: Fixed Timing
    bind:
      source: config
      field: fixedTiming
- type: section
  props:
    title: Ignition Outputs
  children:
  - type: text
    props:
      text: wire each output to the corresponding cylinder number
      variant: hint
  - type: text
    props:
      variant: hint
      text: rusEFI handles firing order
  - type: enum-field
    id: ignitionpinmode
    props:
      options:
      - value: 0
        label: default
      - value: 1
        label: default inverted
      - value: 2
        label: open collector
      - value: 3
        label: open collector inverted
      label: Ignition Output Mode
    bind:
      source: config
      field: ignitionPinMode
