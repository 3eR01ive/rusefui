id: IgnitionTableDialog.panel
description: Ignition advance
source:
  ini_dialog: IgnitionTableDialog
  menu_path: Ignition › Ignition advance
children:
- type: text
  props:
    text: Таблица/кривая «ignitionTableIndicators» — нет определения в INI
    variant: hint
- type: section
  props:
    title: Load override
  children:
  - type: enum-field
    id: ignoverridemode
    props:
      label: Override ignition table load axis
      options:
      - value: 0
        label: None
      - value: 1
        label: MAP
      - value: 2
        label: TPS
      - value: 3
        label: Acc Pedal
      - value: 4
        label: Cyl Filling %
      - value: 5
        label: INVALID
      - value: 6
        label: INVALID
      - value: 7
        label: INVALID
    bind:
      source: config
      field: ignOverrideMode
- type: ignition-table
  id: ignitiontabletbl
  navSelectable: false
  props:
    xLabel: RPM
    title: Ignition Table
    variant: table
  bind:
    source: config
    params:
      zBins: ignitionTable
      xBins: ignitionRpmBins
      yBins: ignitionLoadBins
