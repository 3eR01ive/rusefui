      source: config
      field: throttlePedalPositionAdcChannel
  - type: scalar-field
    id: throttlepedalupvoltage
    props:
      label: Up (idle) voltage
    bind:
      source: config
      field: throttlePedalUpVoltage
  - type: scalar-field
    id: throttlepedalwotvoltage
    props:
      label: Down (WOT) voltage
    bind:
      source: config
      field: throttlePedalWOTVoltage
  - type: enum-field
    id: throttlepedalpositionsecondadcchannel
    props:
      options:
      - value: 0
        label: NONE
      - value: 1
