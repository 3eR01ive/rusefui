      source: config
      field: throttlePedalPositionSecondAdcChannel
  - type: scalar-field
    id: throttlepedalsecondaryupvoltage
    props:
      label: Up (idle) voltage
    bind:
      source: config
      field: throttlePedalSecondaryUpVoltage
  - type: scalar-field
    id: throttlepedalsecondarywotvoltage
    props:
      label: Down (WOT) voltage
    bind:
      source: config
      field: throttlePedalSecondaryWOTVoltage
  - type: text
    props:
      text: 'Кнопка: Grab Idle/Up (cmd_calibrate_pedal_up)'
      variant: hint
  - type: text
    props:
      text: 'Кнопка: Grab WOT/Down (cmd_calibrate_pedal_down)'
      variant: hint
  - type: scalar-field
    id: ppsexpaveragealpha
    props:
      label: Accelerator Exp Average
    bind:
      source: config
      field: ppsExpAverageAlpha
  - type: section
    props:
      title: TPS/PPS Limits
    children:
    - type: scalar-field
      id: tpserrordetectiontoolow
      props:
        label: TPS/PPS minimum valid value
      bind:
        source: config
        field: tpsErrorDetectionTooLow
    - type: scalar-field
      id: tpserrordetectiontoohigh
      props:
        label: TPS/PPS maximum valid value
      bind:
        source: config
        field: tpsErrorDetectionTooHigh
    - type: scalar-field
      id: etbsplit
      props:
        label: TPS/PPS Error Detection Threshold
      bind:
        source: config
        field: etbSplit
  - type: section
    props:
      title: Pedal Position Sensors special cases
    children:
    - type: enum-field
      id: usefordredundantpps
      props:
        options:
        - value: 0
          label: no
        - value: 1
          label: yes
        label: Ford/Toyota redundant PPS mode
      bind:
        source: config
        field: useFordRedundantPps
    - type: scalar-field
      id: ppssecondarymaximum
      props:
        label: Secondary PPS maximum
      bind:
        source: config
        field: ppsSecondaryMaximum
- type: section
  props:
    title: pedalGauges
