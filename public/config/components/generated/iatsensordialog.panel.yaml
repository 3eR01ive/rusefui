id: iatSensorDialog.panel
description: IAT Sensor
source:
  ini_dialog: iatSensorDialog
  menu_path: Sensors › Chassis sensors › IAT sensor
children:
- type: section
  props:
    title: IAT sensor
  children:
  - type: enum-field
    id: iat-adcchannel
    props:
      label: Input channel
      options:
      - value: 0
        label: NONE
      - value: 1
        label: Analog Volt 5
      - value: 2
        label: Analog Volt 6
      - value: 3
        label: Analog Volt 7
      - value: 4
        label: Analog Volt 8
      - value: 5
        label: Analog Volt 9
      - value: 6
        label: Analog Volt 10
      - value: 7
        label: Analog Volt 11
      - value: 8
        label: Battery Sense
      - value: 9
        label: Analog Temp 3
      - value: 10
        label: Analog Temp 4
      - value: 11
        label: Analog Volt 1
      - value: 12
        label: Analog Volt 2
      - value: 13
        label: Analog Volt 3
      - value: 14
        label: Analog Volt 4
      - value: 15
        label: Analog Temp 1
      - value: 16
        label: Analog Temp 2
      - value: 17
        label: INVALID
      - value: 18
        label: INVALID
      - value: 19
        label: INVALID
      - value: 20
        label: INVALID
      - value: 21
        label: INVALID
      - value: 22
        label: INVALID
      - value: 23
        label: INVALID
      - value: 24
        label: INVALID
      - value: 25
        label: INVALID
      - value: 26
        label: INVALID
      - value: 27
        label: INVALID
      - value: 28
        label: INVALID
      - value: 29
        label: INVALID
      - value: 30
        label: INVALID
      - value: 31
        label: INVALID
    bind:
      source: config
      field: iat_adcChannel
  - type: text
    props:
      variant: hint
      text: Input three pairs of thermistor temperature and resistance.
  - type: text
    props:
      text: Typical temperatures are -40 deg C, 0 deg C and 100 deg C
      variant: hint
  - type: scalar-field
    id: iat-tempc-1
    props:
      label: Lowest temperature
    bind:
      source: config
      field: iat_tempC_1
  - type: scalar-field
    id: iat-resistance-1
    props:
      label: Resistance @ LT
    bind:
      source: config
      field: iat_resistance_1
  - type: scalar-field
    id: iat-tempc-2
    props:
      label: Middle temperature
    bind:
      source: config
      field: iat_tempC_2
  - type: scalar-field
    id: iat-resistance-2
    props:
      label: Resistance @ MT
    bind:
      source: config
      field: iat_resistance_2
  - type: scalar-field
    id: iat-tempc-3
    props:
      label: Highest temperature
    bind:
      source: config
      field: iat_tempC_3
  - type: scalar-field
    id: iat-resistance-3
    props:
      label: Resistance @ HT
    bind:
      source: config
      field: iat_resistance_3
  - type: enum-field
    id: uselineariatsensor
    props:
      options:
      - value: 0
        label: no
      - value: 1
        label: yes
      label: Linear characteristic
    bind:
      source: config
      field: useLinearIatSensor
- type: section
  props:
    title: iatGauges
