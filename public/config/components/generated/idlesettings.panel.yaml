id: idleSettings.panel
description: Idle settings
source:
  ini_dialog: idleSettings
  menu_path: Idle › Idle settings
children:
- type: scalar-field
  id: idlemode
  props:
    label: Idle control mode
  bind:
    source: config
    field: idleMode
- type: text
  props:
    variant: hint
    text: Solenoid idle control is disabled at zero RPM
- type: text
  props:
    variant: hint
    text: <html><a href=https://github.com/rusefi/rusefi/wiki/Idle-Control>https://github.com/rusefi/rusefi/wiki/Idle-Control</a></html>
- type: section
  props:
    title: Idle Detection Thresholds
  children:
  - type: scalar-field
    id: idlepiddeactivationtpsthreshold
    props:
      label: TPS threshold
    bind:
      source: config
      field: idlePidDeactivationTpsThreshold
  - type: scalar-field
    id: idlepidrpmupperlimit
    props:
      label: RPM upper limit
    bind:
      source: config
      field: idlePidRpmUpperLimit
  - type: scalar-field
    id: idlepidrpmdeadzone
    props:
      label: RPM deadzone
    bind:
      source: config
      field: idlePidRpmDeadZone
  - type: scalar-field
    id: maxidlevss
    props:
      label: Max vehicle speed
    bind:
      source: config
      field: maxIdleVss
- type: section
  props:
    title: Open Loop Idle
  children:
  - type: scalar-field
    id: acidleextraoffset
    props:
      label: A/C adder
    bind:
      source: config
      field: acIdleExtraOffset
  - type: scalar-field
    id: acidlerpmtarget
    props:
      label: A/C RPM target
    bind:
      source: config
      field: acIdleRpmTarget
  - type: scalar-field
    id: fan1extraidle
    props:
      label: 'Fan #1 adder'
    bind:
      source: config
      field: fan1ExtraIdle
  - type: scalar-field
    id: fan2extraidle
    props:
      label: 'Fan #2 adder'
    bind:
      source: config
      field: fan2ExtraIdle
- type: section
  props:
    title: Closed Loop Idle
  children:
  - type: scalar-field
    id: idlerpmpid-pfactor
    props:
      label: P-factor
    bind:
      source: config
      field: idleRpmPid_pFactor
  - type: scalar-field
    id: idlerpmpid-ifactor
    props:
      label: I-factor
    bind:
      source: config
      field: idleRpmPid_iFactor
  - type: scalar-field
    id: idlerpmpid-dfactor
    props:
      label: D-factor
    bind:
      source: config
      field: idleRpmPid_dFactor
  - type: scalar-field
    id: idlerpmpid-minvalue
    props:
      label: Min
    bind:
      source: config
      field: idleRpmPid_minValue
  - type: scalar-field
    id: idlerpmpid-maxvalue
    props:
      label: Max
    bind:
      source: config
      field: idleRpmPid_maxValue
  - type: scalar-field
    id: idlerpmpid-itermmin
    props:
      label: iTerm Min
    bind:
      source: config
      field: idlerpmpid_iTermMin
  - type: scalar-field
    id: idlerpmpid-itermmax
    props:
      label: iTerm Max
    bind:
      source: config
      field: idlerpmpid_iTermMax
  - type: scalar-field
    id: pidextraforlowrpm
    props:
      label: PID Extra for low RPM
    bind:
      source: config
      field: pidExtraForLowRpm
  - type: scalar-field
    id: useiacpidmulttable
    props:
      label: Use IAC PID Multiplier Table
    bind:
      source: config
      field: useIacPidMultTable
- type: section
  props:
    title: Extra Idle Features
  children:
  - type: scalar-field
    id: useseparateadvanceforidle
    props:
      label: Use idle ignition table
    bind:
      source: config
      field: useSeparateAdvanceForIdle
  - type: scalar-field
    id: useidleadvancewhilecoasting
    props:
      label: Use idle ignition table while coasting
    bind:
      source: config
      field: useIdleAdvanceWhileCoasting
  - type: scalar-field
    id: useseparateveforidle
    props:
      label: Use idle VE table
    bind:
      source: config
      field: useSeparateVeForIdle
  - type: scalar-field
    id: idleveoverridemode
    props:
      label: Override Idle VE table load axis
    bind:
      source: config
      field: idleVeOverrideMode
  - type: scalar-field
    id: idlereturntargetramp
    props:
      label: Ramp target on return to idle
    bind:
      source: config
      field: idleReturnTargetRamp
  - type: scalar-field
    id: idlereturntargetrampduration
    props:
      label: Ramp target duration
    bind:
      source: config
      field: idleReturnTargetRampDuration
  - type: scalar-field
    id: useseparateidletablesforcrankingtaper
    props:
      label: Use idle tables for cranking taper
    bind:
      source: config
      field: useSeparateIdleTablesForCrankingTaper
  - type: scalar-field
    id: useiactableforcoasting
    props:
      label: Use coasting idle table
    bind:
      source: config
      field: useIacTableForCoasting
  - type: scalar-field
    id: iacbytpstaper
    props:
      label: Dashpot coasting-to-idle Initial idle Adder
    bind:
      source: config
      field: iacByTpsTaper
  - type: scalar-field
    id: iacbytpsholdtime
    props:
      label: Dashpot coasting-to-idle Hold time
    bind:
      source: config
      field: iacByTpsHoldTime
  - type: scalar-field
    id: iacbytpsdecaytime
    props:
      label: Dashpot coasting-to-idle Decay time
    bind:
      source: config
      field: iacByTpsDecayTime
