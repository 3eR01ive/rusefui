id: tractionIgnitionSkipDialog.panel
description: Traction Ignition Skip
source:
  ini_dialog: tractionIgnitionSkipDialog
  menu_path: Controller › Traction Control Skip Ignition
children:
- type: enum-field
  id: usehardskipintraction
  props:
    label: useHardSkipInTraction
    options:
    - value: 0
      label: no
    - value: 1
      label: yes
  bind:
    source: config
    field: useHardSkipInTraction
- type: config-table
  id: tractionignitionskiptabletbl
  props:
    title: Traction Control Skip Ignition
    variant: table
  bind:
    source: config
    params:
      zBins: tractionControlIgnitionSkip
      xBins: tractionControlSpeedBins
      yBins: tractionControlSlipBins
