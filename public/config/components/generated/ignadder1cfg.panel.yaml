id: ignAdder1Cfg.panel
description: Ignition adder 1 config
source:
  ini_dialog: ignAdder1Cfg
  menu_path: Ignition › Ignition blend tables › Ignition blend 1 bias
children:
- type: text
  props:
    variant: hint
    text: The bias table controls how much of the blend table
- type: text
  props:
    variant: hint
    text: is mixed in to the base ignition table. For example, a value of
- type: text
  props:
    text: +10 in the table, with 50 as the current bias will result
    variant: hint
- type: text
  props:
    text: in 5.0 degrees of ignition timing added.
    variant: hint
- type: text
  props:
    text: The X axis of the bias table is controlled by the selected blend
    variant: hint
- type: text
  props:
    variant: hint
    text: parameter below.
- type: enum-field
  id: ignblends1-blendparameter
  props:
    label: Blend parameter
    options:
    - value: 0
      label: Zero
    - value: 1
      label: TPS
    - value: 2
      label: MAP
    - value: 3
      label: CLT
    - value: 4
      label: IAT
    - value: 5
      label: Fuel Load
    - value: 6
      label: Ignition Load
    - value: 7
      label: Aux Temp 1
    - value: 8
      label: Aux Temp 2
    - value: 9
      label: Accel Pedal
    - value: 10
      label: Battery Voltage
    - value: 11
      label: VVT 1 In Actual
    - value: 12
      label: VVT 1 Ex Actual
    - value: 13
      label: VVT 2 In Actual
    - value: 14
      label: VVT 2 Ex Actual
    - value: 15
      label: Ethanol (Flex) %
    - value: 16
      label: Aux Linear 1
    - value: 17
      label: Aux Linear 2
    - value: 18
      label: GPPWM Output 1
    - value: 19
      label: GPPWM Output 2
    - value: 20
      label: GPPWM Output 3
    - value: 21
      label: GPPWM Output 4
    - value: 22
      label: Lua Gauge 1
    - value: 23
      label: Lua Gauge 2
    - value: 24
      label: RPM
    - value: 25
      label: Gear (detected)
    - value: 26
      label: Baro pressure
    - value: 27
      label: EGT 1
    - value: 28
      label: EGT 2
    - value: 29
      label: Aux Linear 3
    - value: 30
      label: Aux Linear 4
    - value: 31
      label: Vehicle speed
    - value: 32
      label: Oil pressure
    - value: 33
      label: Oil temp
    - value: 34
      label: Fuel Pressure
  bind:
    source: config
    field: ignBlends1_blendParameter
