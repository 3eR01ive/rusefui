    id: auxlinear2-value2
    props:
      label: High value
    bind:
      source: config
      field: auxLinear2_value2
- type: scalar-field
  id: auxspeedsensorinputpin1
  props:
    label: Aux Speed Input 1
  bind:
    source: config
    field: auxSpeedSensorInputPin1
- type: scalar-field
  id: auxspeedsensorinputpin2
  props:
    label: Aux Speed Input 2
  bind:
    source: config
    field: auxSpeedSensorInputPin2
- type: scalar-field
  id: useauxspeedforslipratio
  props:
    label: Use Aux Speed Sensors for slip ratio
  bind:
    source: config
    field: useAuxSpeedForSlipRatio
- type: scalar-field
