id: auxTempSensor2Sensor.panel
description: aux2 Thermistor Settings
source:
  ini_dialog: auxTempSensor2Sensor
  menu_path: Sensors › Aux sensors › AuxTemp2 sensor
children:
- type: scalar-field
  id: auxtempsensor2-adcchannel
  props:
    label: Input channel
  bind:
    source: config
    field: auxTempSensor2_adcChannel
- type: text
  props:
    text: Here is three pairs of thermistor temperature and resistance.
    variant: hint
- type: text
  props:
    variant: hint
    text: Typical temperatures is -40 deg C, 0 deg C and 100 deg C
- type: scalar-field
  id: auxtempsensor2-tempc-1
  props:
    label: Lowest temperature
  bind:
    source: config
    field: auxTempSensor2_tempC_1
- type: scalar-field
  id: auxtempsensor2-resistance-1
  props:
    label: Resistance @ LT
  bind:
    source: config
    field: auxTempSensor2_resistance_1
- type: scalar-field
  id: auxtempsensor2-tempc-2
  props:
    label: Middle temperature
  bind:
    source: config
    field: auxTempSensor2_tempC_2
- type: scalar-field
  id: auxtempsensor2-resistance-2
  props:
    label: Resistance @ MT
  bind:
    source: config
    field: auxTempSensor2_resistance_2
- type: scalar-field
  id: auxtempsensor2-tempc-3
  props:
    label: Highest temperature
  bind:
    source: config
    field: auxTempSensor2_tempC_3
- type: scalar-field
  id: auxtempsensor2-resistance-3
  props:
    label: Resistance @ HT
  bind:
    source: config
    field: auxTempSensor2_resistance_3
