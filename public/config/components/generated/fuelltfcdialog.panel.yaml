id: fuelLTFCDialog.panel
description: Long term fuel trims
source:
  ini_dialog: fuelLTFCDialog
  menu_path: Fuel › Target AFR adder tables › Long term fuel trims
children:
- type: section
  props:
    title: Trim bank 1
- type: section
  props:
    title: fuelLTFCConfig
  children:
  - type: scalar-field
    id: short-term-fuel-trims-should-be-enabled-and-configured
    props:
      label: Short term fuel trims should be enabled and configured
    bind:
      source: config
      field: Short term fuel trims should be enabled and configured
  - type: section
    props:
      title: Long term fuel trim
    children:
    - type: enum-field
      id: ltft-enabled
      props:
        options:
        - value: 0
          label: 'false'
        - value: 1
          label: 'true'
        label: Enable learning
      bind:
        source: config
        field: ltft_enabled
    - type: scalar-field
      id: ltft-timeconstant
      props:
        label: Time const
      bind:
        source: config
        field: ltft_timeConstant
    - type: scalar-field
      id: ltft-maxadd
      props:
        label: Max add
      bind:
        source: config
        field: ltft_maxAdd
    - type: scalar-field
      id: ltft-maxremove
      props:
        label: Max remove
      bind:
        source: config
        field: ltft_maxRemove
    - type: scalar-field
      id: ltft-deadband
      props:
        label: Learning deadband
      bind:
        source: config
        field: ltft_deadband
    - type: enum-field
      id: ltft-correctionenabled
      props:
        options:
        - value: 0
          label: 'false'
        - value: 1
          label: 'true'
        label: Enable correction
      bind:
        source: config
        field: ltft_correctionEnabled
  - type: section
    props:
      title: Commands
    children:
    - type: text
      props:
        variant: hint
        text: 'Кнопка: Reset LTFT trims (cmd_ltft_reset)'
    - type: text
      props:
        text: 'Кнопка: Apply LTFT to VE and reset (cmd_ltft_apply_to_ve)'
        variant: hint
  - type: section
    props:
      title: Status
    children:
    - type: text
      props:
        variant: hint
        text: Панель «ltftIndicatorsPanel» — нет определения в INI
    - type: text
      props:
        variant: hint
        text: Панель «ltftValuesReadoutPanel» — нет определения в INI
- type: section
  props:
    title: Trim bank 2
