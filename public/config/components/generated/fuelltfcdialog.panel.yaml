id: fuelLTFCDialog.panel
description: Long term fuel trims
source:
  ini_dialog: fuelLTFCDialog
  menu_path: Fuel › VE blend tables › Long term fuel trims
children:
- type: section
  props:
    title: Trim bank 1
- type: section
  props:
    title: fuelLTFCConfig
  children:
  - type: scalar-field
    id: short-term-fuel-trims-should-be-enabled-and-configured
    props:
      label: Short term fuel trims should be enabled and configured
    bind:
      source: config
      field: Short term fuel trims should be enabled and configured
  - type: section
    props:
      title: Long term fuel trim
    children:
    - type: enum-field
      id: ltft-enabled
      props:
        options:
        - value: 0
          label: no
        - value: 1
          label: yes
        label: Gathering Data
      bind:
        source: config
        field: ltft_enabled
    - type: scalar-field
      id: see-short-term-fuel-trim-closed-loop-for-region-definitions
      props:
        label: See Short term fuel trim/Closed loop for region definitions
      bind:
        source: config
        field: See Short term fuel trim/Closed loop for region definitions
    - type: scalar-field
      id: ltft-timeconstant1
      props:
        label: Time const for Idle region
      bind:
        source: config
        field: ltft_timeConstant1
    - type: scalar-field
      id: ltft-timeconstant2
      props:
        label: Time const for Overrun region
      bind:
        source: config
        field: ltft_timeConstant2
    - type: scalar-field
      id: ltft-timeconstant3
      props:
        label: Time const for Power region
      bind:
        source: config
        field: ltft_timeConstant3
    - type: scalar-field
      id: ltft-timeconstant4
      props:
        label: Time const for Cruise region
      bind:
        source: config
        field: ltft_timeConstant4
    - type: scalar-field
      id: ltft-maxadd
      props:
        label: Max add
      bind:
        source: config
        field: ltft_maxAdd
    - type: scalar-field
      id: ltft-maxremove
      props:
        label: Max remove
      bind:
        source: config
        field: ltft_maxRemove
    - type: scalar-field
      id: ltft-deadband
      props:
        label: Learning deadband
      bind:
        source: config
        field: ltft_deadband
    - type: enum-field
      id: ltft-correctionenabled
      props:
        label: Apply Correction
        options:
        - value: 0
          label: no
        - value: 1
          label: yes
      bind:
        source: config
        field: ltft_correctionEnabled
  - type: section
    props:
      title: Commands
    children:
    - type: text
      props:
        variant: hint
        text: 'Кнопка: Reset LTFT trims (cmd_ltft_reset)'
    - type: text
      props:
        variant: hint
        text: 'Кнопка: Apply LTFT to VE and reset (cmd_ltft_apply_to_ve)'
  - type: section
    props:
      title: Status
    children:
    - type: text
      props:
        text: Панель «ltftIndicatorsPanel» — нет определения в INI
        variant: hint
    - type: text
      props:
        text: Панель «ltftValuesReadoutPanel» — нет определения в INI
        variant: hint
- type: section
  props:
    title: Trim bank 2
