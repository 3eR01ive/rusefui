id: veBlend2Cfg.panel
description: VE blend 2 config
source:
  ini_dialog: veBlend2Cfg
  menu_path: Fuel › VE blend tables › VE blend 2 bias
children:
- type: text
  props:
    variant: hint
    text: The bias table controls how much of the blend table
- type: text
  props:
    text: is mixed in to the VE table. For example, a value of
    variant: hint
- type: text
  props:
    variant: hint
    text: +10 in the table, with 50 as the current bias will result
- type: text
  props:
    text: in +5.0% added to the VE. Note that this doesn't add 5% VE,
    variant: hint
- type: scalar-field
  id: instead--it-adds-5--to-the-current-ve-value--multiplying-ve-by-1-05
  props:
    label: instead, it adds 5% to the current VE value, multiplying VE by 1.05.
  bind:
    source: config
    field: instead, it adds 5% to the current VE value, multiplying VE by 1.05.
- type: text
  props:
    variant: hint
    text: The X axis of the bias table is controlled by the selected blend
- type: text
  props:
    text: parameter below.
    variant: hint
- type: scalar-field
  id: veblends2-blendparameter
  props:
    label: Blend parameter
  bind:
    source: config
    field: veBlends2_blendParameter
- type: scalar-field
  id: veblends2-yaxisoverride
  props:
    label: Y axis override (set Zero for no override)
  bind:
    source: config
    field: veBlends2_yAxisOverride
- type: text
  props:
    text: Панель «veBlend2Bias» — нет определения в INI
    variant: hint
