id: fuelLevelDialog.panel
description: Fuel Level Sensor
source:
  ini_dialog: fuelLevelDialog
  menu_path: Sensors › Fuel sensors › Fuel level sensor
children:
- type: section
  props:
    title: fuelLevelSettings
  children:
  - type: enum-field
    id: fuellevelsensor
    props:
      label: Input channel
      options:
      - value: 0
        label: NONE
      - value: 1
        label: Analog Volt 5
      - value: 2
        label: Analog Volt 6
      - value: 3
        label: Analog Volt 7
      - value: 4
        label: Analog Volt 8
      - value: 5
        label: Analog Volt 9
      - value: 6
        label: Analog Volt 10
      - value: 7
        label: Analog Volt 11
      - value: 8
        label: Battery Sense
      - value: 9
        label: Analog Temp 3
      - value: 10
        label: Analog Temp 4
      - value: 11
        label: Analog Volt 1
      - value: 12
        label: Analog Volt 2
      - value: 13
        label: Analog Volt 3
      - value: 14
        label: Analog Volt 4
      - value: 15
        label: Analog Temp 1
      - value: 16
        label: Analog Temp 2
    bind:
      source: config
      field: fuelLevelSensor
  - type: scalar-field
    id: fuellevellowthresholdvoltage
    props:
      label: Low threshold
    bind:
      source: config
      field: fuelLevelLowThresholdVoltage
  - type: scalar-field
    id: fuellevelhighthresholdvoltage
    props:
      label: High threshold
    bind:
      source: config
      field: fuelLevelHighThresholdVoltage
  - type: scalar-field
    id: fuellevelaveragingalpha
    props:
      label: Filter Alpha
    bind:
      source: config
      field: fuelLevelAveragingAlpha
  - type: scalar-field
    id: fuellevelupdateperiodsec
    props:
      label: Update period
    bind:
      source: config
      field: fuelLevelUpdatePeriodSec
  - type: text
    props:
      variant: hint
      text: Таблица/кривая «fuelLevelCurve» — редактор пока не реализован
- type: section
  props:
    title: fuelLevelGauges
