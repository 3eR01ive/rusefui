id: compressorDischargeTemperature.panel
description: Compressor Discharge Temp Settings
source:
  ini_dialog: compressorDischargeTemperature
  menu_path: Sensors › Turbo sensors › Compressor discharge temp
children:
- type: text
  props:
    variant: hint
    text: Put this sensor after the turbocharger/supercharger
- type: text
  props:
    text: but before the intercooler.
    variant: hint
- type: scalar-field
  id: compressordischargetemperature-adcchannel
  props:
    label: Input channel
  bind:
    source: config
    field: compressorDischargeTemperature_adcChannel
- type: scalar-field
  id: compressordischargetemperature-bias-resistor
  props:
    label: Pullup resistor
  bind:
    source: config
    field: compressorDischargeTemperature_bias_resistor
- type: scalar-field
  id: compressordischargetemperature-tempc-1
  props:
    label: Lowest temperature
  bind:
    source: config
    field: compressorDischargeTemperature_tempC_1
- type: scalar-field
  id: compressordischargetemperature-resistance-1
  props:
    label: Resistance @ LT
  bind:
    source: config
    field: compressorDischargeTemperature_resistance_1
- type: scalar-field
  id: compressordischargetemperature-tempc-2
  props:
    label: Middle temperature
  bind:
    source: config
    field: compressorDischargeTemperature_tempC_2
- type: scalar-field
  id: compressordischargetemperature-resistance-2
  props:
    label: Resistance @ MT
  bind:
    source: config
    field: compressorDischargeTemperature_resistance_2
- type: scalar-field
  id: compressordischargetemperature-tempc-3
  props:
    label: Highest temperature
  bind:
    source: config
    field: compressorDischargeTemperature_tempC_3
- type: scalar-field
  id: compressordischargetemperature-resistance-3
  props:
    label: Resistance @ HT
  bind:
    source: config
    field: compressorDischargeTemperature_resistance_3
