id: gppwm4.panel
description: General Purpose PWM 4
source:
  ini_dialog: gppwm4
  menu_path: Advanced › Boost blend tables › General Purpose PWM 4
children:
- type: section
  props:
    title: gppwm4left
  children:
  - type: scalar-field
    id: gppwm4-pin
    props:
      label: Output
    bind:
      source: config
      field: gppwm4_pin
  - type: scalar-field
    id: set-frequency-to-0hz-for-on-off-mode
    props:
      label: Set frequency to 0hz for on-off mode
    bind:
      source: config
      field: Set frequency to 0hz for on-off mode
  - type: scalar-field
    id: gppwm4-pwmfrequency
    props:
      label: Frequency
    bind:
      source: config
      field: gppwm4_pwmFrequency
  - type: scalar-field
    id: gppwm4-onaboveduty
    props:
      label: On above duty
    bind:
      source: config
      field: gppwm4_onAboveDuty
  - type: scalar-field
    id: gppwm4-offbelowduty
    props:
      label: Off below duty
    bind:
      source: config
      field: gppwm4_offBelowDuty
  - type: scalar-field
    id: gppwm4-dutyiferror
    props:
      label: Duty if error
    bind:
      source: config
      field: gppwm4_dutyIfError
  - type: scalar-field
    id: gppwm4-rpmaxis
    props:
      label: X Axis
    bind:
      source: config
      field: gppwm4_rpmAxis
  - type: scalar-field
    id: gppwm4-loadaxis
    props:
      label: Y Axis
    bind:
      source: config
      field: gppwm4_loadAxis
  - type: scalar-field
    id: gppwmnote4
    props:
      label: Note
    bind:
      source: config
      field: gpPwmNote4
- type: text
  props:
    text: Таблица/кривая «gppwm4Tbl» — редактор пока не реализован
    variant: hint
