id: speedSensorCan.panel
description: CAN Vehicle Speed
source:
  ini_dialog: speedSensorCan
  menu_path: CAN-bus › CAN Vehicle speed sensor
children:
- type: enum-field
  id: enablecanvss
  props:
    options:
    - value: 0
      label: no
    - value: 1
      label: yes
    label: Enable CAN VSS
  bind:
    source: config
    field: enableCanVss
- type: enum-field
  id: canvssnbctype
  props:
    label: CAN VSS type
    options:
    - value: 0
      label: BMW_e46
    - value: 1
      label: W202
    - value: 2
      label: BMW E8x/E9x MK60e5
    - value: 3
      label: Nissan 350
    - value: 4
      label: Hyundai PB
    - value: 5
      label: Honda Civic9
    - value: 6
      label: INVALID
    - value: 7
      label: INVALID
  bind:
    source: config
    field: canVssNbcType
- type: scalar-field
  id: canvssscaling
  props:
    label: CAN VSS scaling
  bind:
    source: config
    field: canVssScaling
