id: fuelClosedLoopDialog.panel
description: Short term fuel trim/Closed loop
source:
  ini_dialog: fuelClosedLoopDialog
  menu_path: Fuel › Target AFR adder tables › Short term fuel trim/Closed loop
children:
- type: section
  props:
    title: Bank 1
  children:
  - type: section
    props:
      title: Input/Learning state
    children:
    - type: text
      props:
        text: Панель «fuelClosedLoopInputIndicatorsPanelBank1» — нет определения в INI
        variant: hint
  - type: section
    props:
      title: Output correction
    children:
    - type: scalar-field
      id: correction-state
      props:
        label: 'Correction state:'
      bind:
        source: config
        field: 'Correction state:'
    - type: text
      props:
        text: Панель «fuelClosedLoopOutputIndicatorsPanel» — нет определения в INI
        variant: hint
- type: section
  props:
    title: fuelClosedLoopConfig
  children:
  - type: section
    props:
      title: Short term fuel trim
    children:
    - type: enum-field
      id: fuelclosedloopcorrectionenabled
      props:
        label: Enabled
        options:
        - value: 0
          label: 'false'
        - value: 1
          label: 'true'
      bind:
        source: config
        field: fuelClosedLoopCorrectionEnabled
    - type: scalar-field
      id: settings-used-for-both-correction-and-learning
      props:
        label: 'Settings used for both correction and learning:'
      bind:
        source: config
        field: 'Settings used for both correction and learning:'
    - type: scalar-field
      id: stft-minclt
      props:
        label: Minimum CLT
      bind:
        source: config
        field: stft_minClt
    - type: text
      props:
        variant: hint
        text: "\"Startup delay\"\t\t\t\t\t\t\tstft_startupDelay"
    - type: scalar-field
      id: nofueltrimafterdfcotime
      props:
        label: After DFCO delay
      bind:
        source: config
        field: noFuelTrimAfterDfcoTime
    - type: scalar-field
      id: tuningdetector
      props:
        label: Detect Tuning and Suspend
      bind:
        source: config
        field: tuningDetector
    - type: scalar-field
      id: settings-used-for-learning-only
      props:
        label: 'Settings used for learning only:'
      bind:
        source: config
        field: 'Settings used for learning only:'
    - type: scalar-field
      id: stft-minafr
      props:
        label: Minimum AFR for learning
      bind:
        source: config
        field: stft_minAfr
    - type: scalar-field
      id: stft-maxafr
      props:
        label: Maximum AFR for learning
      bind:
        source: config
        field: stft_maxAfr
    - type: scalar-field
      id: stft-deadband
      props:
        label: Adjustment deadband
      bind:
        source: config
        field: stft_deadband
    - type: enum-field
      id: stftignoreerrormagnitude
      props:
        label: Ignore error magnitude
        options:
        - value: 0
          label: 'false'
        - value: 1
          label: 'true'
      bind:
        source: config
        field: stftIgnoreErrorMagnitude
  - type: section
    props:
      title: Region Configuration
    children:
    - type: scalar-field
      id: stft-maxidleregionrpm
      props:
        label: Idle region RPM
      bind:
        source: config
        field: stft_maxIdleRegionRpm
    - type: scalar-field
      id: stft-maxoverrunload
      props:
        label: Overrun region load
      bind:
        source: config
        field: stft_maxOverrunLoad
    - type: scalar-field
      id: stft-minpowerload
      props:
        label: Power region load
      bind:
        source: config
        field: stft_minPowerLoad
  - type: section
    props:
      title: Idle Region
    children:
    - type: scalar-field
      id: stft-cellcfgs1-timeconstant
      props:
        label: Time const
      bind:
        source: config
        field: stft_cellCfgs1_timeConstant
    - type: scalar-field
      id: stft-cellcfgs1-maxadd
      props:
        label: Max add
      bind:
        source: config
        field: stft_cellCfgs1_maxAdd
    - type: scalar-field
      id: stft-cellcfgs1-maxremove
      props:
        label: Max remove
      bind:
        source: config
        field: stft_cellCfgs1_maxRemove
  - type: section
    props:
      title: Overrun Region
    children:
    - type: scalar-field
      id: stft-cellcfgs2-timeconstant
      props:
        label: Time const
      bind:
        source: config
        field: stft_cellCfgs2_timeConstant
    - type: scalar-field
      id: stft-cellcfgs2-maxadd
      props:
        label: Max add
      bind:
        source: config
        field: stft_cellCfgs2_maxAdd
    - type: scalar-field
      id: stft-cellcfgs2-maxremove
      props:
        label: Max remove
      bind:
        source: config
        field: stft_cellCfgs2_maxRemove
  - type: section
    props:
      title: Power Region
    children:
    - type: scalar-field
      id: stft-cellcfgs3-timeconstant
      props:
        label: Time const
      bind:
        source: config
        field: stft_cellCfgs3_timeConstant
    - type: scalar-field
      id: stft-cellcfgs3-maxadd
      props:
        label: Max add
      bind:
        source: config
        field: stft_cellCfgs3_maxAdd
    - type: scalar-field
      id: stft-cellcfgs3-maxremove
      props:
        label: Max remove
      bind:
        source: config
        field: stft_cellCfgs3_maxRemove
  - type: section
    props:
      title: Main Region
    children:
    - type: scalar-field
      id: stft-cellcfgs4-timeconstant
      props:
        label: Time const
      bind:
        source: config
        field: stft_cellCfgs4_timeConstant
    - type: scalar-field
      id: stft-cellcfgs4-maxadd
      props:
        label: Max add
      bind:
        source: config
        field: stft_cellCfgs4_maxAdd
    - type: scalar-field
      id: stft-cellcfgs4-maxremove
      props:
        label: Max remove
      bind:
        source: config
        field: stft_cellCfgs4_maxRemove
  - type: section
    props:
      title: Status
    children:
    - type: text
      props:
        variant: hint
        text: Панель «fuelClosedLoopIndicatorsPanel» — нет определения в INI
- type: section
  props:
    title: Bank 2
  children:
  - type: section
    props:
      title: Input/Learning state
    children:
    - type: text
      props:
        text: Панель «fuelClosedLoopInputIndicatorsPanelBank2» — нет определения в INI
        variant: hint
  - type: section
    props:
      title: Output correction
    children:
    - type: scalar-field
      id: correction-state
      props:
        label: 'Correction state:'
      bind:
        source: config
        field: 'Correction state:'
    - type: text
      props:
        text: Панель «fuelClosedLoopOutputIndicatorsPanel» — нет определения в INI
        variant: hint
