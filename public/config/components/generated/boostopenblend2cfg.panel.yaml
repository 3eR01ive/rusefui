id: boostOpenBlend2Cfg.panel
description: Boost open loop blend 2 config
source:
  ini_dialog: boostOpenBlend2Cfg
  menu_path: Advanced › Boost blend tables › Open loop 2 bias
children:
- type: text
  props:
    variant: hint
    text: The bias table controls how much of the blend table
- type: text
  props:
    variant: hint
    text: is mixed in to the open loop boost table. For example, a value of
- type: text
  props:
    variant: hint
    text: +10 in the table, with 50 as the current bias will result
- type: text
  props:
    text: in +5.0 added to the boost open loop %.
    variant: hint
- type: text
  props:
    variant: hint
    text: The X axis of the bias table is controlled by the selected blend
- type: text
  props:
    variant: hint
    text: parameter below.
- type: text
  props:
    text: Панель «isBoostControlledPanel» — нет определения в INI
    variant: hint
- type: enum-field
  id: boostopenloopblends2-blendparameter
