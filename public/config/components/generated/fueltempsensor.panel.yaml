id: fuelTempSensor.panel
description: Fuel Temp Sensor Settings
source:
  ini_dialog: fuelTempSensor
  menu_path: Sensors › Fuel sensors › Fuel temp sensor
children:
- type: scalar-field
  id: fueltempsensor-adcchannel
  props:
    label: Input channel
  bind:
    source: config
    field: fuelTempSensor_adcChannel
- type: scalar-field
  id: fueltempsensor-bias-resistor
  props:
    label: Pullup resistor
  bind:
    source: config
    field: fuelTempSensor_bias_resistor
- type: scalar-field
  id: fueltempsensor-tempc-1
  props:
    label: Lowest temperature
  bind:
    source: config
    field: fuelTempSensor_tempC_1
- type: scalar-field
  id: fueltempsensor-resistance-1
  props:
    label: Resistance @ LT
  bind:
    source: config
    field: fuelTempSensor_resistance_1
- type: scalar-field
  id: fueltempsensor-tempc-2
  props:
    label: Middle temperature
  bind:
    source: config
    field: fuelTempSensor_tempC_2
- type: scalar-field
  id: fueltempsensor-resistance-2
  props:
    label: Resistance @ MT
  bind:
    source: config
    field: fuelTempSensor_resistance_2
- type: scalar-field
  id: fueltempsensor-tempc-3
  props:
    label: Highest temperature
  bind:
    source: config
    field: fuelTempSensor_tempC_3
- type: scalar-field
  id: fueltempsensor-resistance-3
  props:
    label: Resistance @ HT
  bind:
    source: config
    field: fuelTempSensor_resistance_3
