      label: Analog Temp 3
    - value: 10
      label: Analog Temp 4
    - value: 11
      label: Analog Volt 1
    - value: 12
      label: Analog Volt 2
    - value: 13
      label: Analog Volt 3
    - value: 14
      label: Analog Volt 4
    - value: 15
      label: Analog Temp 1
    - value: 16
      label: Analog Temp 2
    - value: 17
      label: INVALID
    - value: 18
      label: INVALID
    - value: 19
      label: INVALID
    - value: 20
      label: INVALID
    - value: 21
      label: INVALID
    - value: 22
      label: INVALID
    - value: 23
      label: INVALID
    - value: 24
      label: INVALID
    - value: 25
      label: INVALID
    - value: 26
      label: INVALID
    - value: 27
      label: INVALID
    - value: 28
      label: INVALID
