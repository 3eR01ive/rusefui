id: dwellSettings.panel
description: Dwell
source:
  ini_dialog: dwellSettings
  menu_path: Ignition › Dwell
children:
- type: curve
  id: dwellcorrection
  props:
    xLabel: RPM
    title: Dwell time base
    yLabel: Dwell
  bind:
    source: config
    params:
      yBins: sparkDwellValues
      xBins: sparkDwellRpmBins
- type: curve
  id: dwellvoltagecorrection
  props:
    title: Dwell voltage correction
    yLabel: Multiplier
    xLabel: Battery Volts
  bind:
    source: config
    params:
      yBins: dwellVoltageCorrValues
      xBins: dwellVoltageCorrVoltBins
