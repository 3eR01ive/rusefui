id: ignAdder2Cfg.panel
description: Ignition adder 2 config
source:
  ini_dialog: ignAdder2Cfg
  menu_path: Ignition › Ignition blend tables › Ignition blend 2 bias
children:
- type: text
  props:
    text: The bias table controls how much of the blend table
    variant: hint
- type: text
  props:
    text: is mixed in to the base ignition table. For example, a value of
    variant: hint
- type: text
  props:
    text: +10 in the table, with 50 as the current bias will result
    variant: hint
- type: text
  props:
    variant: hint
    text: in 5.0 degrees of ignition timing added.
- type: text
  props:
    text: The X axis of the bias table is controlled by the selected blend
    variant: hint
- type: text
  props:
    text: parameter below.
    variant: hint
- type: scalar-field
  id: ignblends2-blendparameter
  props:
    label: Blend parameter
  bind:
    source: config
    field: ignBlends2_blendParameter
- type: scalar-field
  id: ignblends2-yaxisoverride
  props:
    label: Y axis override (set Zero for no override)
  bind:
    source: config
    field: ignBlends2_yAxisOverride
- type: text
  props:
    variant: hint
    text: Панель «ignAdder2Bias» — нет определения в INI
