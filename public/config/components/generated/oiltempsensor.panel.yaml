id: oilTempSensor.panel
description: Oil Temp Sensor Settings
source:
  ini_dialog: oilTempSensor
  menu_path: Sensors › Oil sensors › Oil temp sensor
children:
- type: scalar-field
  id: oiltempsensor-adcchannel
  props:
    label: Input channel
  bind:
    source: config
    field: oilTempSensor_adcChannel
- type: scalar-field
  id: oiltempsensor-bias-resistor
  props:
    label: Pullup resistor
  bind:
    source: config
    field: oilTempSensor_bias_resistor
- type: scalar-field
  id: oiltempsensor-tempc-1
  props:
    label: Lowest temperature
  bind:
    source: config
    field: oilTempSensor_tempC_1
- type: scalar-field
  id: oiltempsensor-resistance-1
  props:
    label: Resistance @ LT
  bind:
    source: config
    field: oilTempSensor_resistance_1
- type: scalar-field
  id: oiltempsensor-tempc-2
  props:
    label: Middle temperature
  bind:
    source: config
    field: oilTempSensor_tempC_2
- type: scalar-field
  id: oiltempsensor-resistance-2
  props:
    label: Resistance @ MT
  bind:
    source: config
    field: oilTempSensor_resistance_2
- type: scalar-field
  id: oiltempsensor-tempc-3
  props:
    label: Highest temperature
  bind:
    source: config
    field: oilTempSensor_tempC_3
- type: scalar-field
  id: oiltempsensor-resistance-3
  props:
    label: Resistance @ HT
  bind:
    source: config
    field: oilTempSensor_resistance_3
