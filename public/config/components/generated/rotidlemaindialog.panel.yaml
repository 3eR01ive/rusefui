id: rotIdleMainDialog.panel
description: Rotational Idle
source:
  ini_dialog: rotIdleMainDialog
  menu_path: Advanced › Torque Control › Rotational Idle
children:
- type: section
  props:
    title: Rotational Idle
  children:
  - type: scalar-field
    id: experimental--no-idle-air-adder
    props:
      label: Experimental!,no idle air adder!
    bind:
      source: config
      field: Experimental!,no idle air adder!
  - type: enum-field
    id: rotationalidlecontroller-enabled
    props:
      label: Enable
      options:
      - value: 0
        label: disabled
      - value: 1
        label: enabled
    bind:
      source: config
      field: rotationalIdleController_enabled
  - type: enum-field
    id: rotationalidlecontroller-auto-engage-clt-enable
    props:
      options:
      - value: 0
        label: disabled
      - value: 1
        label: enabled
      label: Auto enable based on CLT
    bind:
      source: config
      field: rotationalIdleController_auto_engage_clt_enable
  - type: enum-field
    id: rotationalidlecontroller-auto-engage
    props:
      label: Auto enable based on TPS/PPS
      options:
      - value: 0
        label: disabled
      - value: 1
        label: enabled
    bind:
      source: config
      field: rotationalIdleController_auto_engage
  - type: scalar-field
    id: rotationalidlecontroller-auto-engage-clt
    props:
      label: Minimum CLT
    bind:
      source: config
      field: rotationalIdleController_auto_engage_clt
  - type: scalar-field
    id: rotationalidlecontroller-max-tps
    props:
      label: Maximum TPS/PPS  (0 to disable)
    bind:
      source: config
      field: rotationalIdleController_max_tps
  - type: scalar-field
    id: max-should-always-be---number-of-cylinders-2----x------1--x-is-multiplier-to-give-more-variations-of-patterns
    props:
      label: MAX should always be ((number_of_cylinders/2) * X) +/- 1, X is multiplier to give more variations of patterns
    bind:
      source: config
      field: MAX should always be ((number_of_cylinders/2) * X) +/- 1, X is multiplier to give more variations of patterns
  - type: scalar-field
    id: if-max-is-multiple-of-n-cylinders--then-pattern-will-not-shift-as-expected
    props:
      label: if max is multiple of n_cylinders, then pattern will not shift as expected
    bind:
      source: config
      field: if max is multiple of n_cylinders, then pattern will not shift as expected
  - type: scalar-field
    id: for-4-cyl--start-max-5--adder-1--for-6-cyl--max-7-adder-1
    props:
      label: for 4 cyl, start max=5, adder=1, for 6 cyl, max=7 adder=1
    bind:
      source: config
      field: for 4 cyl, start max=5, adder=1, for 6 cyl, max=7 adder=1
  - type: scalar-field
    id: offset-works-only-in-new-rotational-idle-logic
    props:
      label: offset works only in new rotational idle logic
    bind:
      source: config
      field: offset works only in new rotational idle logic
  - type: scalar-field
    id: rotationalidlecontroller-accumulators1-acc-max
    props:
      label: Accumulator Max 1
    bind:
      source: config
      field: rotationalIdleController_accumulators1_acc_max
  - type: scalar-field
    id: rotationalidlecontroller-accumulators1-acc-adder
    props:
      label: Accumulator Adder 1
    bind:
      source: config
      field: rotationalIdleController_accumulators1_acc_adder
  - type: scalar-field
    id: rotationalidlecontroller-accumulators1-acc-offset
    props:
      label: Accumulator Offset 1
    bind:
      source: config
      field: rotationalIdleController_accumulators1_acc_offset
  - type: scalar-field
    id: rotationalidlecontroller-accumulators2-acc-max
    props:
      label: Accumulator Max 2
    bind:
      source: config
      field: rotationalIdleController_accumulators2_acc_max
  - type: scalar-field
    id: rotationalidlecontroller-accumulators2-acc-adder
    props:
      label: Accumulator Adder 2
    bind:
      source: config
      field: rotationalIdleController_accumulators2_acc_adder
  - type: scalar-field
    id: rotationalidlecontroller-accumulators2-acc-offset
    props:
      label: Accumulator Offset 2
    bind:
      source: config
      field: rotationalIdleController_accumulators2_acc_offset
  - type: scalar-field
    id: rotationalidlecontroller-accumulators3-acc-max
    props:
      label: Accumulator Max 3
    bind:
      source: config
      field: rotationalIdleController_accumulators3_acc_max
  - type: scalar-field
    id: rotationalidlecontroller-accumulators3-acc-adder
    props:
      label: Accumulator Adder 3
    bind:
      source: config
      field: rotationalIdleController_accumulators3_acc_adder
  - type: scalar-field
    id: rotationalidlecontroller-accumulators3-acc-offset
    props:
      label: Accumulator Offset 3
    bind:
      source: config
      field: rotationalIdleController_accumulators3_acc_offset
- type: section
  props:
    title: live_data_rotational_idle
  children:
  - type: text
    props:
      text: Панель «live_data_rotational_idleIndicatorPanel» — нет определения в INI
      variant: hint
