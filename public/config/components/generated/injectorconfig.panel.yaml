id: injectorConfig.panel
description: Injection configuration
source:
  ini_dialog: injectorConfig
  menu_path: Fuel › Injection configuration
children:
- type: section
  props:
    title: Injection
  children:
  - type: enum-field
    id: isinjectionenabled
    props:
      options:
      - value: 0
        label: 'false'
      - value: 1
        label: 'true'
      label: Enabled
    bind:
      source: config
      field: isInjectionEnabled
  - type: enum-field
    id: injectionmode
    props:
      options:
      - value: 0
        label: Simultaneous
      - value: 1
        label: Sequential
      - value: 2
        label: Batch
      - value: 3
        label: Single Point
      label: Mode
    bind:
      source: config
      field: injectionMode
  - type: text
    props:
      text: Batch injection with individual wiring
      variant: hint
  - type: enum-field
    id: alphanuseiat
    props:
      options:
      - value: 0
        label: 'false'
      - value: 1
        label: 'true'
      label: Alpha-N uses IAT density correction
    bind:
      source: config
      field: alphaNUseIat
  - type: enum-field
    id: veoverridemode
    props:
      options:
      - value: 0
        label: None
      - value: 1
        label: MAP
      - value: 2
        label: TPS
      - value: 3
        label: INVALID
      label: Override VE table load axis
    bind:
      source: config
      field: veOverrideMode
  - type: enum-field
    id: afroverridemode
    props:
      options:
      - value: 0
        label: None
      - value: 1
        label: MAP
      - value: 2
        label: TPS
      - value: 3
        label: Acc Pedal
      - value: 4
        label: Cyl Filling %
      - value: 5
        label: INVALID
      - value: 6
        label: INVALID
      - value: 7
        label: INVALID
      label: Override AFR table load axis
    bind:
      source: config
      field: afrOverrideMode
  - type: enum-field
    id: injectiontimingmode
    props:
      options:
      - value: 0
        label: End of injection
      - value: 1
        label: Start of injection
      - value: 2
        label: Center of injection
      - value: 3
        label: INVALID
      label: Injection timing control mode
    bind:
      source: config
      field: injectionTimingMode
- type: section
  props:
    title: Injector Settings
  children:
  - type: scalar-field
    id: injector-flow
    props:
      label: Injector flow
    bind:
      source: config
      field: injector_flow
  - type: enum-field
    id: injectorflowasmassflow
    props:
      label: Injector flow units
      options:
      - value: 0
        label: cc/min
      - value: 1
        label: grams per second
    bind:
      source: config
      field: injectorFlowAsMassFlow
  - type: enum-field
    id: injectorpressuretype
    props:
      options:
      - value: 0
        label: Low
      - value: 1
        label: High
      label: Fuel rail pressure sensor
    bind:
      source: config
      field: injectorPressureType
  - type: enum-field
    id: injectorcompensationmode
    props:
      options:
      - value: 0
        label: None
      - value: 1
        label: Fixed rail pressure
      - value: 2
        label: Sensed Rail Pressure
      - value: 3
        label: HPFP fuel mass compensation
      label: Injector flow compensation mode
    bind:
      source: config
      field: injectorCompensationMode
  - type: scalar-field
    id: fuelreferencepressure
    props:
      label: Injector reference pressure
    bind:
      source: config
      field: fuelReferencePressure
- type: section
  props:
    title: Fuel characteristics
  children:
  - type: scalar-field
    id: stoichratioprimary
    props:
      label: Stoichiometric ratio
    bind:
      source: config
      field: stoichRatioPrimary
  - type: scalar-field
    id: stoichratiosecondary
    props:
      label: E100 stoichiometric ratio
    bind:
      source: config
      field: stoichRatioSecondary
- type: text
  props:
    variant: hint
    text: Панель «injectorsDeadTime» — нет определения в INI
