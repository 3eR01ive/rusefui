id: idleValvePosDialog.panel
description: ETB-style Idle valve position sensor
source:
  ini_dialog: idleValvePosDialog
  menu_path: Sensors › Chassis sensors › ETB-style Idle valve position sensor
children:
- type: section
  props:
    title: idleValvePosConfig
  children:
  - type: enum-field
    id: idlepositionchannel
    props:
      options:
      - value: 0
        label: NONE
      - value: 1
        label: Analog Volt 5
      - value: 2
        label: Analog Volt 6
      - value: 3
        label: Analog Volt 7
      - value: 4
        label: Analog Volt 8
      - value: 5
        label: Analog Volt 9
      - value: 6
        label: Analog Volt 10
      - value: 7
        label: Analog Volt 11
      - value: 8
        label: Battery Sense
      - value: 9
        label: Analog Temp 3
      - value: 10
        label: Analog Temp 4
      - value: 11
        label: Analog Volt 1
      - value: 12
        label: Analog Volt 2
      - value: 13
        label: Analog Volt 3
      - value: 14
        label: Analog Volt 4
      - value: 15
        label: Analog Temp 1
      - value: 16
        label: Analog Temp 2
      label: Input
    bind:
      source: config
      field: idlePositionChannel
  - type: scalar-field
    id: idlepositionmin
    props:
      label: Min (valve closed, low idle)
    bind:
      source: config
      field: idlePositionMin
  - type: scalar-field
    id: idlepositionmax
    props:
      label: Max (valve open, high idle)
    bind:
      source: config
      field: idlePositionMax
- type: section
  props:
    title: idleValvePosGauges
