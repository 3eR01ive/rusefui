id: sdCard.panel
description: SD Card
source:
  ini_dialog: sdCard
  menu_path: Controller › SD Card Logger
children:
- type: section
  props:
    title: SD Card Interface
  children:
  - type: enum-field
    id: issdcardenabled
    props:
      options:
      - value: 0
        label: disabled
      - value: 1
        label: enabled
      label: SD Card Logging
    bind:
      source: config
      field: isSdCardEnabled
- type: text
  props:
    text: Панель «sdPresentIndicators» — нет определения в INI
    variant: hint
- type: text
  props:
    variant: hint
    text: Панель «sdCardActivityIndicators» — нет определения в INI
- type: section
  props:
    title: SD Card Logging
  children:
  - type: text
    props:
      text: rusEFI logs to SD when powered without USB connected
      variant: hint
  - type: text
    props:
      variant: hint
      text: and USB not connected for 15 seconds
  - type: text
    props:
      text: OR when Always start in Logging mode is enabled
      variant: hint
  - type: text
    props:
      variant: hint
      text: rusEFI connects SD to your PC when powered by USB
  - type: enum-field
    id: alwayswritesdcard
    props:
      label: Always start in Logging mode
      options:
      - value: 0
        label: no
      - value: 1
        label: yes
    bind:
      source: config
      field: alwaysWriteSdCard
  - type: enum-field
    id: sdtriggerlog
    props:
      label: SD logger mode
      options:
      - value: 0
        label: Full MLG
      - value: 1
        label: Trigger
    bind:
      source: config
      field: sdTriggerLog
  - type: scalar-field
    id: sdcardlogfrequency
    props:
      label: MLG logger rate
    bind:
      source: config
      field: sdCardLogFrequency
  - type: enum-field
    id: sdtriggerlogcsv
    props:
      options:
      - value: 0
        label: Binary
      - value: 1
        label: CSV
      label: Trigger logger foramt
    bind:
      source: config
      field: sdTriggerLogCsv
- type: text
  props:
    variant: hint
    text: Панель «sdCardStateIndicators» — нет определения в INI
- type: text
  props:
    text: Панель «sdCardErrorPanel» — нет определения в INI
    variant: hint
- type: section
  props:
    title: SD commands
  children:
  - type: text
    props:
      text: 'Кнопка: Mount to PC (cmd_mount_pc)'
      variant: hint
  - type: text
    props:
      text: 'Кнопка: Mount to ECU (cmd_mount_ecu)'
      variant: hint
  - type: text
    props:
      text: 'Кнопка: Unmount (cmd_unmount)'
      variant: hint
  - type: text
    props:
      text: 'Кнопка: Format (cmd_format)'
      variant: hint
- type: section
  props:
    title: Fail reports
  children:
  - type: scalar-field
    id: executed-only-when-sd-card-is-mounted-to-ecu
    props:
      label: Executed only when SD card is mounted to ECU
    bind:
      source: config
      field: Executed only when SD card is mounted to ECU
  - type: text
    props:
      variant: hint
      text: 'Кнопка: Remove all fail reports (cmd_delete_reports)'
  - type: text
    props:
      text: Панель «sdCardErrorReportIndicators» — нет определения в INI
      variant: hint
