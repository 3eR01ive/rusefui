id: iatSensor.panel
description: IAT Sensor
source:
  ini_dialog: iatSensor
  menu_path: Sensors › Chassis sensors › IAT sensor
children:
- type: section
  props:
    title: IAT sensor
  children:
  - type: scalar-field
    id: iat-adcchannel
    props:
      label: Input channel
    bind:
      source: config
      field: iat_adcChannel
  - type: text
    props:
      variant: hint
      text: Input three pairs of thermistor temperature and resistance.
  - type: text
    props:
      text: Typical temperatures are -40 deg C, 0 deg C and 100 deg C
      variant: hint
  - type: scalar-field
    id: iat-tempc-1
    props:
      label: Lowest temperature
    bind:
      source: config
      field: iat_tempC_1
  - type: scalar-field
    id: iat-resistance-1
    props:
      label: Resistance @ LT
    bind:
      source: config
      field: iat_resistance_1
  - type: scalar-field
    id: iat-tempc-2
    props:
      label: Middle temperature
    bind:
      source: config
      field: iat_tempC_2
  - type: scalar-field
    id: iat-resistance-2
    props:
      label: Resistance @ MT
    bind:
      source: config
      field: iat_resistance_2
  - type: scalar-field
    id: iat-tempc-3
    props:
      label: Highest temperature
    bind:
      source: config
      field: iat_tempC_3
  - type: scalar-field
    id: iat-resistance-3
    props:
      label: Resistance @ HT
    bind:
      source: config
      field: iat_resistance_3
  - type: scalar-field
    id: uselineariatsensor
    props:
      label: Linear characteristic
    bind:
      source: config
      field: useLinearIatSensor
- type: section
  props:
    title: iatGauges
