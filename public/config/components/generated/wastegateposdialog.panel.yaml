id: wastegatePosDialog.panel
description: Electronic Wastegate position sensor
source:
  ini_dialog: wastegatePosDialog
  menu_path: Sensors › Turbo sensors › Electronic Wastegate position sensor
children:
- type: section
  props:
    title: wastegatePosConfig
  children:
  - type: enum-field
    id: wastegatepositionsensor
    props:
      options:
      - value: 0
        label: NONE
      - value: 1
        label: Analog Volt 5
      - value: 2
        label: Analog Volt 6
      - value: 3
        label: Analog Volt 7
      - value: 4
        label: Analog Volt 8
      - value: 5
        label: Analog Volt 9
      - value: 6
        label: Analog Volt 10
      - value: 7
        label: Analog Volt 11
      - value: 8
        label: Battery Sense
      - value: 9
        label: Analog Temp 3
      - value: 10
        label: Analog Temp 4
      - value: 11
        label: Analog Volt 1
      - value: 12
        label: Analog Volt 2
      - value: 13
        label: Analog Volt 3
      - value: 14
        label: Analog Volt 4
      - value: 15
        label: Analog Temp 1
      - value: 16
        label: Analog Temp 2
      label: Input
    bind:
      source: config
      field: wastegatePositionSensor
  - type: scalar-field
    id: wastegatepositionclosedvoltage
    props:
      label: Min (fully closed, most boost)
    bind:
      source: config
      field: wastegatePositionClosedVoltage
  - type: scalar-field
    id: wastegatepositionopenedvoltage
    props:
      label: Max (fully open, least boost)
    bind:
      source: config
      field: wastegatePositionOpenedVoltage
- type: section
  props:
    title: wastegatePosGauges
