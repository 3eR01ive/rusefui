[package]
name = "rusefi-ini"
description = "Minimal TunerStudio INI parser for rusefui data sources"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2.0"

[[bin]]
name = "ini-convert-panels"
path = "src/bin/ini-convert-panels.rs"

[dev-dependencies]
serde_json = "1"
