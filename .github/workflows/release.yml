name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # actions/checkout, setup-node на Node 24 (deprecation Node 20 на runner, с июня 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      # Версия бандлов = tauri.conf.json; тег релиза = git tag (не v0.3.0 при теге v0.4.0).
      - name: Sync app version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          export VER
          node -e "
            const fs = require('fs');
            const v = process.env.VER;
            for (const p of ['src-tauri/tauri.conf.json', 'package.json']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = v;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: rusefui ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Сборки rusefui для Linux и Windows.

            - **Linux**: `.deb` и `.AppImage`
            - **Windows**: `.msi` и NSIS `.exe`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
